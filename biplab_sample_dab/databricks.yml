# This is a Declarative Automation Bundle definition for biplab_sample_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: biplab_sample_dab
  uuid: 5f65ba1d-a6cf-42c9-8991-c3b1ce88b5ae

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8ae8e7a4-0a81.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8ae8e7a4-0a81.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dbiplab3@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dbiplab3@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: dbiplab3@gmail.com
        level: CAN_MANAGE
